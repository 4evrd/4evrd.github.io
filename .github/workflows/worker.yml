name: worker

# Deploys the install-count Worker (worker/) to Cloudflare when it changes on
# main, or by hand. Needs the repository secrets CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, SALT and STATS_KEY (worker/README.md).
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # the table (idempotent), then the Worker with its secrets
          preCommands: npx wrangler d1 execute evrd-installs --remote --file schema.sql
          command: deploy
          secrets: |
            SALT
            STATS_KEY
        env:
          SALT: ${{ secrets.SALT }}
          STATS_KEY: ${{ secrets.STATS_KEY }}
