name: worker

# Deploys the install-count Worker (worker/) to Cloudflare when it changes on
# main, or by hand. Needs the repository secrets CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, SALT and STATS_KEY (worker/README.md).
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          workingDirectory: worker
          # the table (idempotent), then the Worker with its secrets
          preCommands: npx wrangler d1 execute evrd-installs --remote --file schema.sql
          command: deploy
          secrets: |
            SALT
            STATS_KEY
        env:
          SALT: ${{ secrets.SALT }}
          STATS_KEY: ${{ secrets.STATS_KEY }}
      # Fail open: past the free plan's daily request limit the route skips
      # the Worker and goes straight to GitHub Pages (only counting pauses).
      # Set after every deploy, as a deploy can recreate the route.
      - name: route fails open
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          api() { curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          zone=$(api 'https://api.cloudflare.com/client/v4/zones?name=evrd.sh' | jq -r '.result[0].id')
          [ -n "$zone" ] && [ "$zone" != null ] || { echo "can't see the evrd.sh zone with this token"; exit 1; }
          route=$(api "https://api.cloudflare.com/client/v4/zones/$zone/workers/routes" | jq -c '.result[] | select(.pattern == "evrd.sh/api/*")')
          [ -n "$route" ] || { echo "no evrd.sh/api/* route"; exit 1; }
          id=$(echo "$route" | jq -r .id)
          echo "$route" | jq '{pattern, script} + {request_limit_fail_open: true}' |
            api -X PUT "https://api.cloudflare.com/client/v4/zones/$zone/workers/routes/$id" --data @- |
            jq -e '.success and .result.request_limit_fail_open' >/dev/null
          echo "evrd.sh/api/* fails open"
